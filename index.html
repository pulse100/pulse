<title>نَبُض لحضور الطلاب</title>

<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>

<style>
:root{
  --champagne:#F0E6D2;
  --gold:#C6A227;
  --gold-dark:#a8891f;
  --charcoal:#141210;
  --smoke:#6F6A5E;
  --white:#FFFDF8;
  --danger:#9B3A2E;
  --ok:#3E6B4F;
}
*{box-sizing:border-box;}
body{
  margin:0;background:var(--champagne);color:var(--charcoal);
  font-family:'Tajawal',sans-serif;min-height:100vh;
}
.wrap{max-width:880px;margin:0 auto;padding:22px 16px 70px;}
.brand{display:flex;align-items:center;gap:14px;justify-content:center;flex-direction:column;text-align:center;margin-bottom:22px;}
.logo-circle{
  width:88px;height:88px;border-radius:50%;overflow:hidden;
  border:3px solid var(--gold);box-shadow:0 4px 18px rgba(198,162,39,.35);
  background:var(--white);
}
.logo-circle img{width:100%;height:100%;object-fit:cover;}
h1.title{font-family:'Amiri',serif;font-weight:700;font-size:1.9rem;margin:6px 0 2px;color:var(--charcoal);}
.tagline{color:var(--smoke);font-size:.85rem;}
.card{
  background:var(--white);border:1px solid #E3D8BC;border-radius:10px;
  padding:18px;margin-bottom:16px;box-shadow:0 2px 10px rgba(20,18,16,.05);
}
.card h2{font-family:'Amiri',serif;color:var(--gold-dark);font-size:1.25rem;margin:0 0 12px;border-bottom:2px solid var(--champagne);padding-bottom:8px;}
.purpose-box{background:linear-gradient(135deg,var(--gold) 0%,var(--gold-dark) 100%);color:var(--white);border-radius:10px;padding:16px 18px;margin-bottom:18px;position:relative;}
.purpose-box .lbl{font-size:.75rem;opacity:.85;margin-bottom:4px;}
.purpose-box p{margin:0;font-size:.95rem;line-height:1.7;}
.purpose-box .edit-btn{position:absolute;top:12px;left:12px;}
.btn{
  font-family:'Tajawal',sans-serif;font-weight:700;font-size:.85rem;
  background:var(--gold);color:var(--charcoal);border:none;border-radius:7px;
  padding:9px 16px;cursor:pointer;transition:filter .15s;
}
.btn:hover{filter:brightness(1.06);}
.btn.outline{background:transparent;color:var(--gold-dark);border:1.5px solid var(--gold);}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger);}
.btn.dark{background:var(--charcoal);color:var(--champagne);}
.btn.sm{padding:5px 10px;font-size:.72rem;border-radius:6px;}
.btn.ghost{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.5);}
input,textarea,select{
  width:100%;padding:10px 12px;border:1.5px solid #E3D8BC;border-radius:7px;
  font-family:'Tajawal',sans-serif;font-size:.9rem;background:var(--white);color:var(--charcoal);
}
label.f{display:block;font-size:.78rem;color:var(--smoke);margin:10px 0 4px;font-weight:700;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
.tile{
  background:var(--white);border:1.5px solid var(--gold);border-radius:10px;padding:16px 12px;
  text-align:center;cursor:pointer;position:relative;transition:transform .12s;
}
.tile:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(198,162,39,.25);}
.tile .name{font-weight:700;font-size:.95rem;margin-top:4px;}
.tile .actions{position:absolute;top:6px;left:6px;display:flex;gap:4px;}
.tile .actions button{
  border:none;background:rgba(20,18,16,.06);border-radius:5px;width:24px;height:24px;
  font-size:.75rem;cursor:pointer;color:var(--charcoal);
}
.breadcrumb{font-size:.8rem;color:var(--smoke);margin-bottom:14px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.breadcrumb span{cursor:pointer;color:var(--gold-dark);font-weight:700;}
.breadcrumb .sep{color:#c9bd9a;}
table{width:100%;border-collapse:collapse;font-size:.85rem;}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid #EEE4C9;}
th{color:var(--gold-dark);font-size:.75rem;}
.mono{font-family:'Tajawal',sans-serif;color:var(--smoke);font-size:.8rem;}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:700;cursor:pointer;}
.pill.present{background:#E4EFE7;color:var(--ok);}
.pill.absent{background:#F4E4E1;color:var(--danger);}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.topbar .who{font-size:.82rem;color:var(--smoke);}
.icon-btn{
  width:40px;height:40px;border-radius:50%;background:var(--gold);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:var(--charcoal);
}
.login-card{max-width:360px;margin:40px auto 0;}
.tg-float-icon{
  position:absolute;top:-38px;left:50%;transform:translateX(-50%);
  width:76px;height:76px;
  filter:drop-shadow(0 14px 18px rgba(26,147,210,.5));
  animation:floatIcon 3s ease-in-out infinite;
}
.haidar-glow-icon{
  position:absolute;top:-34px;left:50%;transform:translateX(-50%);
  width:68px;height:68px;object-fit:cover;border-radius:50%;
  border:3px solid var(--gold);
  box-shadow:0 0 0 4px var(--charcoal), 0 0 26px 8px rgba(20,18,16,.55), 0 8px 16px rgba(0,0,0,.4);
  animation:glowPulse 2.4s ease-in-out infinite;
}
@keyframes floatIcon{
  0%,100%{transform:translateX(-50%) translateY(0);}
  50%{transform:translateX(-50%) translateY(-8px);}
}
@keyframes glowPulse{
  0%,100%{box-shadow:0 0 0 4px var(--charcoal), 0 0 20px 6px rgba(20,18,16,.5), 0 8px 16px rgba(0,0,0,.4);}
  50%{box-shadow:0 0 0 4px var(--charcoal), 0 0 34px 12px rgba(20,18,16,.7), 0 8px 16px rgba(0,0,0,.4);}
}
.overlay{
  position:fixed;inset:0;background:rgba(20,18,16,.55);display:none;
  align-items:center;justify-content:center;z-index:50;padding:16px;
}
.overlay.show{display:flex;}
.modal{background:var(--white);border-radius:12px;padding:22px;max-width:440px;width:100%;max-height:85vh;overflow:auto;}
.modal h3{font-family:'Amiri',serif;color:var(--gold-dark);margin:0 0 12px;font-size:1.2rem;}
.modal .actions{display:flex;gap:10px;margin-top:16px;justify-content:flex-end;}
.empty{color:#a99;font-size:.85rem;padding:14px;text-align:center;}
.subject-header{background:var(--charcoal);color:var(--champagne);border-radius:10px;padding:16px 18px;margin-bottom:16px;}
.subject-header h2{color:var(--gold);border:none;margin:0;}
.stat-row{display:flex;gap:22px;margin-top:8px;flex-wrap:wrap;}
.stat{font-size:.8rem;color:#d8cfb8;}
.stat b{color:var(--gold);font-size:1.1rem;display:block;}
.checkbox-list{max-height:180px;overflow:auto;border:1px solid #E3D8BC;border-radius:7px;padding:8px;}
.checkbox-list label{display:flex;align-items:center;gap:8px;font-size:.85rem;padding:5px 0;font-weight:400;color:var(--charcoal);}
</style>
</head>

async function remoteGet(key){
  try{
    const { data, error } = await sb.from('app_data').select('value').eq('key', key).maybeSingle();
    if(error){ console.error('remoteGet error', key, error.message||'', error.code||'', error.details||'', error.hint||''); return null; }
    return data ? data.value : null;
  }catch(e){ console.error('remoteGet exception', key, e.message||e); return null; }
}
async function remoteSet(key, val){
  try{
    const { error } = await sb.from('app_data').upsert({ key, value: val, updated_at: new Date().toISOString() });
    if(error) console.error('remoteSet error', key, error.message||'', error.code||'', error.details||'', error.hint||'');
  }catch(e){ console.error('remoteSet exception', key, e.message||e); }
}

    if(i===2){

      if(!hasSubj){ structure.subjects.push({id:uid(),courseId:c1.id,name:'مادة تجريبية',schedule:'',enrolledIds:[]}); changed=true; }
    }
  });
  if(changed) saveStructure();
}

function tryLoginWithCode(v){
  if(v===people.adminCode){ session={role:'admin',user:{name:'المدير'}}; render(); return true; }
  if(v===COORDINATOR_CODE){ session={role:'coordinator',user:{name:'المقرر'}}; render(); return true; }
  if(people.representative && v===people.representative.code){
    session={role:'rep',user:people.representative};
    const stage=structure.stages.find(s=>s.id===people.representative.stageId);
    nav={deptId:stage?stage.deptId:null, stageId:people.representative.stageId||null, courseId:null, section:null, subjectId:null};
    render(); return true;
  }
  const t=people.teachers.find(x=>x.code===v);
  if(t){ session={role:'teacher',user:t}; render(); return true; }
  const s=people.students.find(x=>x.code===v);
  if(s){ session={role:'student',user:s}; render(); return true; }
  return false;
}
let loginCamStream=null, loginScanning=false;
function bindLogin(){
  if(!people.adminCode){
    $('#setupBtn').onclick=async()=>{
      const v=$('#setupCode').value.trim();
      if(!v) return;
      people.adminCode=v; await savePeople();
      session={role:'admin',user:{name:'المدير'}};
      render();
    };
  } else {
    $('#loginBtn').onclick=()=>{
      const v=$('#loginCode').value.trim();
      if(!tryLoginWithCode(v)) $('#loginErr').textContent='رمز غير صحيح';
    };
    $('#modeCode').onclick=()=>{
      stopLoginCam();
      $('#loginByCode').style.display='block'; $('#loginByBarcode').style.display='none';
      $('#modeCode').className='btn dark sm'; $('#modeBarcode').className='btn outline sm';
    };
    $('#modeBarcode').onclick=async()=>{
      $('#loginByCode').style.display='none'; $('#loginByBarcode').style.display='block';
      $('#modeBarcode').className='btn dark sm'; $('#modeCode').className='btn outline sm';
      $('#loginErr').textContent='';
      try{
        loginCamStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
        const v=$('#loginVideo'); v.srcObject=loginCamStream; v.play();
        loginScanning=true; requestAnimationFrame(loginScanLoop);
      }catch(e){
        $('#loginErr').textContent='تعذر تشغيل الكاميرا — جرب "دخول بالرمز" بدلاً عنها';
      }
    };
  }
}
function stopLoginCam(){ loginScanning=false; if(loginCamStream){ loginCamStream.getTracks().forEach(t=>t.stop()); loginCamStream=null; } }
function loginScanLoop(){
  if(!loginScanning) return;
  const video=$('#loginVideo'), canvas=$('#loginCanvas');
  if(video && video.readyState===video.HAVE_ENOUGH_DATA){
    canvas.width=video.videoWidth; canvas.height=video.videoHeight;
    const ctx=canvas.getContext('2d');
    ctx.drawImage(video,0,0,canvas.width,canvas.height);
    const img=ctx.getImageData(0,0,canvas.width,canvas.height);
    const code=window.jsQR ? jsQR(img.data,img.width,img.height) : null;
    if(code){
      stopLoginCam();
      if(!tryLoginWithCode(code.data.trim())){
        $('#loginErr')&&($('#loginErr').textContent='رمز غير معروف');
      }
      return;
    }
  }
  requestAnimationFrame(loginScanLoop);
}

function goBack(){

function breadcrumb(){
  const dept=structure.departments.find(d=>d.id===nav.deptId);
  const stage=structure.stages.find(s=>s.id===nav.stageId);
  const course=structure.courses.find(c=>c.id===nav.courseId);

  if(dept){parts.push(`<span class="sep">›</span><span data-nav="dept">${dept.name}</span>`);}
  if(stage){parts.push(`<span class="sep">›</span><span data-nav="stage">${stage.name}</span>`);}
  if(course){parts.push(`<span class="sep">›</span><span data-nav="course">${course.name}</span>`);}
  if(nav.section){parts.push(`<span class="sep">›</span><span data-nav="section">شعبة ${nav.section}</span>`);}
  if(subject){parts.push(`<span class="sep">›</span><span>${subject.name}</span>`);}
  const hasBack = session.role==='rep' ? (nav.courseId||nav.section||nav.subjectId) : (nav.deptId||nav.stageId||nav.courseId||nav.section||nav.subjectId);
  return `<div class="row" style="justify-content:space-between;align-items:center;margin-bottom:14px;">
    <div class="breadcrumb" style="margin-bottom:0;">${parts.join('')}</div>
    ${hasBack?`<button class="btn outline sm" id="backBtn">← رجوع</button>`:''}
  </div>`;
}
function bindBreadcrumb(){
  $('#backBtn')&&($('#backBtn').onclick=goBack);
  document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>{
    const lv=b.dataset.nav;
    if(session.role==='rep'){
      if(lv==='home'){nav.courseId=null;nav.section=null;nav.subjectId=null;}
      if(lv==='course'){nav.section=null;nav.subjectId=null;}

    }
    if(lv==='home'){nav={deptId:null,stageId:null,courseId:null,section:null,subjectId:null};}
    if(lv==='dept'){nav.stageId=null;nav.courseId=null;nav.section=null;nav.subjectId=null;}
    if(lv==='stage'){nav.courseId=null;nav.section=null;nav.subjectId=null;}

}

          <div class="name">${s.name}</div>

// ---------- SUBJECT PAGE (attendance + grades) ----------
function subjectStudents(subject){
  return people.students.filter(st=>subject.enrolledIds.includes(st.id));
}
function attendancePct(subjectId,studentId){
  const recs=attendance.filter(a=>a.subjectId===subjectId&&a.studentId===studentId);
  if(!recs.length) return null;
  const present=recs.filter(r=>r.status==='present').length;
  return Math.round((present/recs.length)*100);
}
function renderSubject(){
  const subject=structure.subjects.find(s=>s.id===nav.subjectId);
  const canRegisterAttendance = ['admin','teacher','rep'].includes(session.role);
  const canManageEnrollment = ['admin','teacher','coordinator'].includes(session.role);
  const canEditPastSessions = ['admin','teacher'].includes(session.role);
  const showDoctorInfo = ['admin','coordinator','rep'].includes(session.role);
  const canEditDoctorInfo = ['admin','coordinator'].includes(session.role);
  const enrolled=subjectStudents(subject);
  const dates=[...new Set(attendance.filter(a=>a.subjectId===subject.id).map(a=>a.date))].sort().reverse();

  return `
  ${topbar()}
  ${breadcrumb()}
  <div class="subject-header">
    <h2>${subject.name}</h2>
    <div class="mono" style="color:#c9bd9a;">${subject.schedule||'لا يوجد جدول محدد'}</div>
    <div class="stat-row">
      <div class="stat"><b>${enrolled.length}</b>طالب مسجل</div>
      <div class="stat"><b>${dates.length}</b>جلسة مسجلة</div>
    </div>
  </div>

  ${showDoctorInfo?`
  <div class="card">
    <div class="row" style="justify-content:space-between;">
      <h2 style="border:none;margin:0;">بيانات الدكتور</h2>
      ${canEditDoctorInfo?`<button class="btn sm outline" id="editDoctorInfo">تعديل</button>`:''}
    </div>
    <div class="mono">${subject.doctorName?('الاسم: '+subject.doctorName):'الاسم: غير مضاف'}</div>
    <div class="mono">${subject.doctorPhone?('الهاتف: '+subject.doctorPhone):'الهاتف: غير مضاف'}</div>
  </div>`:''}

  ${canRegisterAttendance?`
  <div class="card" style="background:var(--charcoal);">
    <h2 style="color:var(--gold);border-bottom:1px solid #3a352c;padding-bottom:8px;">تسجيل الحضور</h2>
    <div class="row">
      <button class="btn dark sm" style="flex:1;background:var(--smoke);color:#fff;" id="openSession">تسجيل يدوي</button>
      <button class="btn dark sm" style="flex:1;background:var(--gold);color:var(--charcoal);" id="btnBarcodeAttendance">بالكاميرا</button>
      <button class="btn dark sm" style="flex:1;background:var(--gold-dark);color:#fff;" id="btnQuickReaderInSubject">قارئ سريع (USB/بلوتوث)</button>
    </div>
    <div class="mono" style="color:#c9bd9a;margin-top:10px;">
      يدوي: تعليم حاضر/غايب من قائمة. بالكاميرا: تصوير الباركود. قارئ سريع: جهاز متوصل بالحاسبة.
      كل مسح ثاني لنفس الطالب بنفس اليوم يسجله "خروج" تلقائياً.
    </div>
    <input type="date" id="sessionDate" value="${new Date().toISOString().slice(0,10)}" style="display:none;">
  </div>` : ''}
  ${canManageEnrollment?`
  <div class="card">
    <div class="row" style="justify-content:space-between;">
      <h2 style="border:none;margin:0;">الطلاب المسجلين بالمادة</h2>
      <button class="btn sm" id="manageEnroll">+ / − إدارة التسجيل</button>
    </div>
  </div>` : ''}

  <div class="card">
    <div class="row" style="justify-content:space-between;">
      <h2 style="border:none;margin:0;">سجل الطلاب</h2>
      ${canRegisterAttendance?`<input type="date" id="reportDate" value="${new Date().toISOString().slice(0,10)}" style="max-width:150px;">`:''}
    </div>
    ${canRegisterAttendance?`<div class="row" style="margin-bottom:12px;"><button class="btn outline sm" id="exportExcel" style="flex:1;">تصدير كشف Excel</button><button class="btn dark sm" id="shareWhatsapp" style="flex:1;background:#25D366;color:#fff;">مشاركة واتساب</button></div>`:''}
    <table>
      <thead><tr><th>الاسم</th><th>تاريخ الدخول</th><th>تاريخ الخروج</th></tr></thead>
      <tbody>
        ${enrolled.length? enrolled.map(st=>{
          const today=new Date().toISOString().slice(0,10);
          const rec=attendance.find(a=>a.subjectId===subject.id&&a.studentId===st.id&&a.date===today);
          return `<tr>
            <td>${st.name}</td>
            <td class="mono">${rec&&rec.time?rec.date+' • '+rec.time:'—'}</td>
            <td class="mono">${rec&&rec.outTime?rec.date+' • '+rec.outTime:'—'}</td>
          </tr>`;
        }).join('') : `<tr><td colspan="3" class="empty">لا يوجد طلاب مسجلين بهذي المادة</td></tr>`}

    </table>

  ${dates.length?`
  <div class="card">
    <h2>الجلسات السابقة</h2>
    ${dates.map(d=>{
      const recs=attendance.filter(a=>a.subjectId===subject.id&&a.date===d);

        <div class="row" style="max-width:180px;">
          ${canEditPastSessions?`<button class="btn sm outline" data-open-date="${d}">عرض/تعديل</button><button class="btn sm danger" data-del-date="${d}">حذف</button>`:''}
        </div>
      </div>`;
    }).join('')}
  </div>`:''}
  `;
}

// ---------- STUDENT PROFILE ----------
let studentNav={courseId:null, subjectId:null};
function renderStudentProfile(){
  const st=session.user;
  const stage=structure.stages.find(s=>s.id===st.stageId);
  const infoCard=`
  <div class="card">
    <h2>ملفك الشخصي</h2>
    <div class="mono">${st.name} — التسلسل: ${st.universityId}</div>
    <div class="mono" style="margin-top:4px;">${stage?stage.name:'المرحلة: غير محددة'}${st.section?' — شعبة '+st.section:''}</div>
  </div>`;

  if(!stage){
    return `${topbar()}${infoCard}<div class="card"><div class="empty">ما تحددت مرحلتك الدراسية بعد — راجع المشرف</div></div>`;
  }

  // subject detail view
  if(studentNav.subjectId){
    const sub=structure.subjects.find(s=>s.id===studentNav.subjectId);
    const pct=attendancePct(sub.id,st.id);
    const g=grades.find(x=>x.subjectId===sub.id&&x.studentId===st.id)||{saai:'—',grade:'—'};
    const recs=attendance.filter(a=>a.subjectId===sub.id&&a.studentId===st.id).sort((a,b)=>b.date.localeCompare(a.date));
    return `${topbar()}
    <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:14px;">
      <div class="breadcrumb" style="margin-bottom:0;">${stage.name} › <span data-snav="course">الكورس</span> › ${sub.name}</div>
      <button class="btn outline sm" id="snBack">← رجوع</button>
    </div>
    <div class="subject-header">
      <h2>${sub.name}</h2>
      <div class="stat-row">
        <div class="stat"><b>${pct===null?'—':pct+'%'}</b>نسبة الحضور</div>
        <div class="stat"><b>${g.saai}</b>السعي</div>
        <div class="stat"><b>${g.grade}</b>الدرجة</div>
      </div>
    </div>
    <div class="card">
      <h2>الأيام المسجلة</h2>
      <table><thead><tr><th>التاريخ</th><th>الحالة</th></tr></thead>
      <tbody>${recs.length?recs.map(r=>`<tr><td class="mono">${r.date}</td><td><span class="pill ${r.status}">${r.status==='present'?'حاضر':'غائب'}</span></td></tr>`).join(''):'<tr><td colspan="2" class="empty">لا يوجد سجل بعد</td></tr>'}</tbody>
      </table>
    </div>`;
  }

  // course -> subjects view
  if(studentNav.courseId){
    const course=structure.courses.find(c=>c.id===studentNav.courseId);
    const subs=structure.subjects.filter(s=>s.courseId===course.id && s.enrolledIds.includes(st.id));
    return `${topbar()}
    <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:14px;">
      <div class="breadcrumb" style="margin-bottom:0;">${stage.name} › ${course.name}</div>
      <button class="btn outline sm" id="snBack">← رجوع</button>
    </div>
    <div class="card">
      <h2>المواد</h2>
      <div class="grid">
        ${subs.length? subs.map(s=>`<div class="tile" data-snav-subject="${s.id}"><div class="name">${s.name}</div></div>`).join('') : '<div class="empty">ما اكو مواد مسجل فيها بهذا الكورس</div>'}
      </div>
    </div>`;
  }

  // courses view (default)
  const courses=structure.courses.filter(c=>c.stageId===stage.id);
  return `${topbar()}
  ${infoCard}
  <div class="card">
    <h2>الكورسات</h2>
    <div class="grid">
      ${courses.length? courses.map(c=>`<div class="tile" data-snav-course="${c.id}"><div class="name">${c.name}</div></div>`).join('') : '<div class="empty">لا توجد كورسات لمرحلتك بعد</div>'}
    </div>
  </div>`;
}
function bindStudentNav(){
  document.querySelectorAll('[data-snav-course]').forEach(t=>t.addEventListener('click',()=>{ studentNav.courseId=t.dataset.snavCourse; render(); }));
  document.querySelectorAll('[data-snav-subject]').forEach(t=>t.addEventListener('click',()=>{ studentNav.subjectId=t.dataset.snavSubject; render(); }));
  $('#snBack')&&($('#snBack').onclick=()=>{
    if(studentNav.subjectId){ studentNav.subjectId=null; }
    else if(studentNav.courseId){ studentNav.courseId=null; }
    render();
  });
}

// ---------- MAIN RENDER ----------
function render(){
  const app=$('#app');
  if(!session.role){ app.innerHTML=renderLogin(); bindLogin(); return; }
  if(session.role==='student'){ app.innerHTML=renderStudentProfile(); bindTopbar(); bindStudentNav(); return; }
  if(session.role==='rep'){ app.innerHTML=renderRepFlow(); bindTopbar(); bindRepNav(); return; }

  // admin / coordinator / teacher navigation
  let html='';
  if(nav.subjectId) html=renderSubject();
  else if(nav.courseId) html=renderCourse();
  else if(nav.stageId) html=renderStage();
  else if(nav.deptId) html=renderDept();
  else html = (session.role==='admin'||session.role==='coordinator') ? renderAdminHome() : renderTeacherHome();

  app.innerHTML=html;
  bindTopbar(); bindBreadcrumb(); bindPurpose();
  bindDynamic();
}

function renderRepFlow(){
  if(nav.subjectId) return renderSubject();
  if(nav.courseId) return renderCourse();
  return renderRepHome();
}
function renderRepHome(){
  const stage=structure.stages.find(s=>s.id===nav.stageId);
  if(!stage){
    return `${topbar()}<div class="card"><div class="empty">ما تحددت لك مرحلة بعد من قبل المدير — راجعه لتفعيل حسابك كممثل</div></div>`;
  }
  const courses=structure.courses.filter(c=>c.stageId===stage.id);
  return `${topbar()}
  <div class="card"><h2>الممثل</h2><div class="mono">${stage.name}</div></div>
  <div class="card">
    <h2>${stage.name} — الكورسات</h2>
    <div class="grid">${courses.length? courses.map(c=>`<div class="tile" data-open-course="${c.id}"><div class="name">${c.name}</div></div>`).join('') : '<div class="empty">لا توجد كورسات بعد</div>'}</div>
  </div>`;
}
function bindRepNav(){
  bindBreadcrumb();
  bindDynamic();
}

function renderTeacherHome(){
  const mySubs=structure.subjects.filter(s=>session.user.subjectIds.includes(s.id));
  return `
  ${topbar(`<button class="icon-btn" id="btnQuickReader" title="قارئ سريع" style="background:var(--charcoal);color:var(--gold);">⚡</button>`)}
  ${purposeBox(false)}
  <div class="card">
    <h2>موادك</h2>
    <div class="grid">
      ${mySubs.length? mySubs.map(s=>`<div class="tile" data-open-subject="${s.id}"><div class="name">${s.name}</div></div>`).join('') : '<div class="empty">ماكو مواد مسندة إلك حالياً</div>'}
    </div>
  </div>`;
}

// ---------- EVENT BINDING FOR DYNAMIC CONTENT ----------
function bindDynamic(){
  // navigation opens
  document.querySelectorAll('[data-open-dept]').forEach(t=>t.addEventListener('click',(e)=>{ if(e.target.tagName==='BUTTON')return; nav.deptId=t.dataset.openDept; render();}));
  document.querySelectorAll('[data-open-stage]').forEach(t=>t.addEventListener('click',(e)=>{ if(e.target.tagName==='BUTTON')return; nav.stageId=t.dataset.openStage; render();}));
  document.querySelectorAll('[data-open-course]').forEach(t=>t.addEventListener('click',(e)=>{ if(e.target.tagName==='BUTTON')return; nav.courseId=t.dataset.openCourse; nav.section=null; render();}));
  document.querySelectorAll('[data-pick-section]').forEach(t=>t.addEventListener('click',()=>{ nav.section=t.dataset.pickSection; render();}));
  document.querySelectorAll('[data-open-section]').forEach(t=>t.addEventListener('click',()=>openSectionModal(nav.stageId, t.dataset.openSection)));
  document.querySelectorAll('[data-open-roster]').forEach(t=>t.addEventListener('click',()=>openStageRosterModal(t.dataset.openRoster)));
  document.querySelectorAll('[data-open-subject]').forEach(t=>t.addEventListener('click',(e)=>{ if(e.target.tagName==='BUTTON')return; nav.subjectId=t.dataset.openSubject; render();}));

  // department CRUD
  $('#dedupeStudents')&&($('#dedupeStudents').onclick=async()=>{
    const seen=new Set();
    const before=people.students.length;
    people.students=people.students.filter(st=>{
      const k=[st.name,st.universityId,st.stageId,st.section].join('|');
      if(seen.has(k)) return false;
      seen.add(k); return true;
    });
    const removed=before-people.students.length;
    if(removed===0){ alert('ماكو تكرار — كل الأسماء فريدة'); return; }
    if(!confirm(`راح يتحذف ${removed} اسم مكرر. متأكد؟`)) return;
    await savePeople(); alert(`تم حذف ${removed} اسم مكرر`); render();
  });

  $('#exportBackup')&&($('#exportBackup').onclick=()=>{
    const backup={purpose,people,structure,attendance,grades,exportedAt:new Date().toISOString()};
    const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=`nabudh-backup-${new Date().toISOString().slice(0,10)}.json`; a.click();
  });
  $('#importBackupFile')&&($('#importBackupFile').onchange=(e)=>{
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=async(ev)=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(!confirm('هذا راح يستبدل كل البيانات الحالية بالنسخة المستوردة. متأكد؟')) return;
        purpose=data.purpose||''; people=data.people||people; structure=data.structure||structure;
        attendance=data.attendance||[]; grades=data.grades||[];
        await savePurpose(); await savePeople(); await saveStructure(); await saveAttendance(); await saveGrades();
        alert('تم الاستيراد بنجاح'); render();
      }catch(err){ alert('ملف غير صالح'); }
    };
    reader.readAsText(file);
  });

  $('#assignRepStage')&&($('#assignRepStage').onclick=()=>{
    const stageOptions=structure.stages.map(s=>{
      const dept=structure.departments.find(d=>d.id===s.deptId);
      return `<option value="${s.id}" ${people.representative.stageId===s.id?'selected':''}>${dept?dept.name+' — ':''}${s.name}</option>`;
    }).join('');
    openModal('تعيين مرحلة الممثل', `
      <label class="f">المرحلة</label>
      <select id="fRepStage"><option value="">-- بدون تحديد --</option>${stageOptions}</select>
    `, async()=>{
      people.representative.stageId=$('#fRepStage').value||null;
      await savePeople(); closeModal(); render();
    });
  });

  $('#addDept')&&($('#addDept').onclick=()=>openModal('إضافة قسم', `<label class="f">اسم القسم</label><input id="fName" placeholder="مثال: هندسة طب حياتي">`, async()=>{
    const v=$('#fName').value.trim(); if(!v)return;
    structure.departments.push({id:uid(),name:v}); await saveStructure(); closeModal(); render();
  }));
  document.querySelectorAll('[data-edit-dept]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();
    const d=structure.departments.find(x=>x.id===b.dataset.editDept);
    openModal('تعديل القسم', `<label class="f">اسم القسم</label><input id="fName" value="${d.name}">`, async()=>{
      d.name=$('#fName').value.trim(); await saveStructure(); closeModal(); render();
    });
  });
  document.querySelectorAll('[data-del-dept]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();
    if(!confirm('حذف القسم وكل مراحله ومواده؟')) return;
    const id=b.dataset.delDept;
    structure.departments=structure.departments.filter(d=>d.id!==id);
    structure.stages=structure.stages.filter(s=>s.deptId!==id);
    saveStructure(); render();
  });

  // stage CRUD
  $('#addStage')&&($('#addStage').onclick=()=>openModal('إضافة مرحلة', `<label class="f">اسم المرحلة</label><input id="fName" placeholder="مثال: المرحلة الأولى">`, async()=>{
    const v=$('#fName').value.trim(); if(!v)return;
    structure.stages.push({id:uid(),deptId:nav.deptId,name:v}); await saveStructure(); closeModal(); render();
  }));
  document.querySelectorAll('[data-edit-stage]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();
    const s=structure.stages.find(x=>x.id===b.dataset.editStage);
    openModal('تعديل المرحلة', `<label class="f">الاسم</label><input id="fName" value="${s.name}">`, async()=>{
      s.name=$('#fName').value.trim(); await saveStructure(); closeModal(); render();
    });
  });
  document.querySelectorAll('[data-del-stage]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();
    if(!confirm('حذف المرحلة؟')) return;
    const id=b.dataset.delStage;
    structure.stages=structure.stages.filter(s=>s.id!==id);
    saveStructure(); render();
  });

  // course CRUD
  $('#addCourse')&&($('#addCourse').onclick=()=>openModal('إضافة كورس', `<label class="f">اسم الكورس</label><input id="fName" placeholder="مثال: الكورس الأول">`, async()=>{
    const v=$('#fName').value.trim(); if(!v)return;
    structure.courses.push({id:uid(),stageId:nav.stageId,name:v}); await saveStructure(); closeModal(); render();
  }));
  document.querySelectorAll('[data-edit-course]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();
    const c=structure.courses.find(x=>x.id===b.dataset.editCourse);
    openModal('تعديل الكورس', `<label class="f">الاسم</label><input id="fName" value="${c.name}">`, async()=>{
      c.name=$('#fName').value.trim(); await saveStructure(); closeModal(); render();
    });
  });
  document.querySelectorAll('[data-del-course]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();
    if(!confirm('حذف الكورس؟')) return;
    const id=b.dataset.delCourse;
    structure.courses=structure.courses.filter(c=>c.id!==id);
    saveStructure(); render();
  });

  // subject CRUD
  $('#addSubject')&&($('#addSubject').onclick=()=>openModal('إضافة مادة', `<label class="f">اسم المادة</label><input id="fName" placeholder="مثال: فسلجة">
    <label class="f">الجدول (وصف)</label><input id="fSched" placeholder="مثال: الأحد والثلاثاء">
    <label class="f">اسم الدكتور</label><input id="fDoctorName" placeholder="اسم الدكتور">
    <label class="f">هاتف الدكتور</label><input id="fDoctorPhone" placeholder="07xxxxxxxxx">`, async()=>{
    const v=$('#fName').value.trim(); if(!v)return;
    structure.subjects.push({id:uid(),courseId:nav.courseId,name:v,schedule:$('#fSched').value.trim(),doctorName:$('#fDoctorName').value.trim(),doctorPhone:$('#fDoctorPhone').value.trim(),enrolledIds:[]});
    await saveStructure(); closeModal(); render();
  }));
  document.querySelectorAll('[data-edit-subject]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();
    const s=structure.subjects.find(x=>x.id===b.dataset.editSubject);
    openModal('تعديل المادة', `<label class="f">الاسم</label><input id="fName" value="${s.name}">
      <label class="f">الجدول</label><input id="fSched" value="${s.schedule||''}">
      <label class="f">اسم الدكتور</label><input id="fDoctorName" value="${s.doctorName||''}">
      <label class="f">هاتف الدكتور</label><input id="fDoctorPhone" value="${s.doctorPhone||''}">`, async()=>{
      s.name=$('#fName').value.trim(); s.schedule=$('#fSched').value.trim();
      s.doctorName=$('#fDoctorName').value.trim(); s.doctorPhone=$('#fDoctorPhone').value.trim();
      await saveStructure(); closeModal(); render();
    });
  });
  $('#editDoctorInfo')&&($('#editDoctorInfo').onclick=()=>{
    const s=structure.subjects.find(x=>x.id===nav.subjectId);
    openModal('بيانات الدكتور', `
      <label class="f">اسم الدكتور</label><input id="fDoctorName" value="${s.doctorName||''}">
      <label class="f">هاتف الدكتور</label><input id="fDoctorPhone" value="${s.doctorPhone||''}">`, async()=>{
      s.doctorName=$('#fDoctorName').value.trim(); s.doctorPhone=$('#fDoctorPhone').value.trim();
      await saveStructure(); closeModal(); render();

  // export styled excel report + whatsapp share
  async function buildAttendanceWorkbookBlob(subject, date, enrolled){
    const wb=new ExcelJS.Workbook();
    const ws=wb.addWorksheet('الحضور');
    ws.views=[{rightToLeft:true}];
    ws.mergeCells('A1:D1');
    ws.getCell('A1').value=`قائمة حضور مادة ${subject.name}`;
    ws.getCell('A1').font={bold:true,size:14};
    ws.getCell('A1').alignment={horizontal:'center'};
    ws.mergeCells('A2:D2');
    ws.getCell('A2').value=`التاريخ: ${date}`;
    ws.getCell('A2').font={bold:true};
    ws.getCell('A2').alignment={horizontal:'center'};
    const headerRow=ws.getRow(4);
    headerRow.values=['التسلسل','الاسم','الحالة','الوقت'];
    headerRow.font={bold:true};
    headerRow.eachCell(c=>{c.alignment={horizontal:'center'};});
    let presentCount=0, absentCount=0;
    enrolled.forEach((st,i)=>{
      const rec=attendance.find(a=>a.subjectId===subject.id&&a.studentId===st.id&&a.date===date);
      const isPresent=rec&&rec.status==='present';
      const row=ws.addRow([i+1, st.name, isPresent?'حاضر':'غايب', rec?(rec.time||''):'']);
      if(!isPresent){
        absentCount++;
        row.eachCell(cell=>{ cell.font={color:{argb:'FFFF0000'},strike:true}; });
      } else { presentCount++; }
    });
    const footerIdx=ws.rowCount+2;
    ws.getCell(`A${footerIdx}`).value=`عدد الحاضرين: ${presentCount}`;
    ws.getCell(`A${footerIdx}`).font={bold:true,color:{argb:'FF3E6B4F'}};
    ws.getCell(`B${footerIdx}`).value=`عدد الغائبين: ${absentCount}`;
    ws.getCell(`B${footerIdx}`).font={bold:true,color:{argb:'FFB5443A'}};
    ws.columns=[{width:10},{width:28},{width:12},{width:12}];
    const buf=await wb.xlsx.writeBuffer();
    return new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  }
  $('#exportExcel')&&($('#exportExcel').onclick=async()=>{
    const subject=structure.subjects.find(s=>s.id===nav.subjectId);
    const enrolled=subjectStudents(subject);
    const date=$('#reportDate').value||new Date().toISOString().slice(0,10);
    if(!window.ExcelJS){ alert('تعذر تحميل مكتبة Excel — تحقق من الاتصال بالإنترنت'); return; }

    }
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=fileName; a.click();
    const text=encodeURIComponent(`كشف حضور مادة ${subject.name} - ${date} (الملف تحمّل عندك تلقائياً — أرفقه يدوياً هنا)`);
    window.open(`https://wa.me/?text=${text}`,'_blank');
  });
}

// ---------- BARCODE CAMERA ATTENDANCE ----------
let bcStream=null, bcScanning=false, bcLastCode='', bcLastTime=0;
function openBarcodeAttendanceModal(){
  const subject=structure.subjects.find(s=>s.id===nav.subjectId);
  const today=new Date().toISOString().slice(0,10);
  $('#modalBody').innerHTML=`
    <h3>تسجيل حضور — ${subject.name}</h3>
    <video id="bcVideo" playsinline style="width:100%;border-radius:8px;background:#000;"></video>
    <canvas id="bcCanvas" style="display:none;"></canvas>
    <div class="scan-status-bc" id="bcStatus" style="margin-top:10px;padding:10px;border-radius:7px;background:var(--champagne);font-weight:700;font-size:.85rem;">وجّه باركود الطالب أمام الكاميرا</div>
    <div id="bcLog" style="margin-top:10px;max-height:180px;overflow:auto;font-size:.82rem;"></div>
    <div class="actions">
      <button class="btn dark" id="bcClose">إنهاء</button>
    </div>`;
  $('#overlay').classList.add('show');
  $('#bcClose').onclick=()=>{ bcScanning=false; if(bcStream){bcStream.getTracks().forEach(t=>t.stop());bcStream=null;} closeModal(); render(); };

  const log=[];
  function renderLog(){ $('#bcLog').innerHTML=log.map(l=>`<div>✅ ${l.name} — ${l.kind||''} <span class="mono">${l.time}</span></div>`).join(''); }

  navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(stream=>{
    bcStream=stream; const v=$('#bcVideo'); v.srcObject=stream; v.play();
    bcScanning=true; bcLastCode=''; bcLastTime=0;
    requestAnimationFrame(function loop(){
      if(!bcScanning) return;
      const video=$('#bcVideo'), canvas=$('#bcCanvas');
      if(video && video.readyState===video.HAVE_ENOUGH_DATA){
        canvas.width=video.videoWidth; canvas.height=video.videoHeight;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(video,0,0,canvas.width,canvas.height);
        const img=ctx.getImageData(0,0,canvas.width,canvas.height);
        const code=window.jsQR ? jsQR(img.data,img.width,img.height) : null;
        if(code){
          const val=code.data.trim();
          const now=Date.now();
          if(!(val===bcLastCode && now-bcLastTime<3000)){
            bcLastCode=val; bcLastTime=now;
            const st=people.students.find(s=>s.code===val);
            const statusEl=$('#bcStatus');
            if(!st){ statusEl.textContent='رمز غير معروف — الطالب غير مسجل بالنظام'; statusEl.style.color='var(--danger)'; }
            else{
              const already=attendance.find(a=>a.subjectId===subject.id&&a.studentId===st.id&&a.date===today);
              const nowTimeStr=new Date().toLocaleTimeString('ar-IQ',{hour:'2-digit',minute:'2-digit'});
              if(!already){
                attendance.push({id:uid(),subjectId:subject.id,studentId:st.id,date:today,status:'present',time:nowTimeStr});
                saveAttendance();
                statusEl.textContent=`تم تسجيل دخول: ${st.name}`; statusEl.style.color='var(--ok)';
                log.unshift({name:st.name,time:nowTimeStr,kind:'دخول'}); renderLog();
              } else if(!already.outTime){
                already.outTime=nowTimeStr;
                saveAttendance();
                statusEl.textContent=`تم تسجيل خروج: ${st.name}`; statusEl.style.color='var(--ok)';
                log.unshift({name:st.name,time:nowTimeStr,kind:'خروج'}); renderLog();
              } else {
                statusEl.textContent=`${st.name} — دخول وخروج مسجلين مسبقاً اليوم`; statusEl.style.color='var(--gold-dark)';
              }
            }
          }
        }
      }
      requestAnimationFrame(loop);
    });
  }).catch(()=>{
    $('#bcStatus').textContent='تعذر تشغيل الكاميرا (قد تكون محظورة بهذي المعاينة)';
    $('#bcStatus').style.color='var(--danger)';
  });
}

// ---------- QUICK READER MODE (USB/Bluetooth barcode scanner) ----------
function subjectFullLabel(subject){
  const course=structure.courses.find(c=>c.id===subject.courseId);
  const stage=course?structure.stages.find(s=>s.id===course.stageId):null;
  const dept=stage?structure.departments.find(d=>d.id===stage.deptId):null;
  return [dept?dept.name:null, stage?stage.name:null, course?course.name:null, subject.name].filter(Boolean).join(' › ');
}
function openQuickReaderModal(initialSubjectId){
  let subjects = structure.subjects;
  if(session.role==='teacher') subjects = subjects.filter(s=>session.user.subjectIds.includes(s.id));
  let currentSubjectId = initialSubjectId;

  function renderInner(){
    if(!currentSubjectId){
      $('#modalBody').innerHTML = `
        <h3>وضع القارئ السريع</h3>
        <label class="f">اختر المادة اللي راح تسجل فيها الحضور</label>
        <select id="qrSubjectSelect">
          <option value="">-- اختر مادة --</option>
          ${subjects.map(s=>`<option value="${s.id}">${subjectFullLabel(s)}</option>`).join('')}
        </select>
        <button class="btn dark" style="width:100%;margin-top:14px;" id="qrConfirmSubject">تأكيد والبدء</button>
        <div class="actions"><button class="btn outline" id="qrCancelPick">إلغاء</button></div>
      `;
      $('#overlay').classList.add('show');
      $('#qrCancelPick').onclick=closeModal;
      $('#qrConfirmSubject').onclick=()=>{
        const v=$('#qrSubjectSelect').value;
        if(!v) return;
        currentSubjectId=v; renderInner();
      };
    } else {
      const subject=structure.subjects.find(s=>s.id===currentSubjectId);
      const today=new Date().toISOString().slice(0,10);
      const log=[];
      $('#modalBody').innerHTML = `
        <h3>وضع القارئ السريع</h3>
        <div style="background:var(--charcoal);color:var(--gold);border-radius:8px;padding:10px 14px;margin-bottom:10px;">
          تسجل الآن حضور: <b>${subjectFullLabel(subject)}</b>
        </div>
        <input id="quickScanInput" placeholder="امسح الباركود هنا..." autocomplete="off">
        <div id="qrLiveStatus" class="mono" style="margin-top:8px;"></div>
        <div id="quickLog" style="margin-top:10px;max-height:200px;overflow:auto;font-size:.82rem;"></div>
        <div class="actions">
          <button class="btn outline" id="qrChangeSubject">تغيير المادة</button>
          <button class="btn dark" id="qrFinish">إنهاء</button>
        </div>
      `;
      $('#overlay').classList.add('show');
      const input=$('#quickScanInput');
      input.focus();
      $('#qrChangeSubject').onclick=()=>{ currentSubjectId=null; renderInner(); };
      $('#qrFinish').onclick=()=>{ closeModal(); render(); };
      function renderLog(){ $('#quickLog').innerHTML=log.map(l=>`<div>✅ ${l.name} — ${l.kind||''} <span class="mono">${l.time}</span></div>`).join(''); }
      input.addEventListener('keydown',(e)=>{
        if(e.key==='Enter'){
          e.preventDefault();
          const val=input.value.trim();
          input.value='';
          if(!val) return;
          const st=people.students.find(s=>s.code===val);
          const statusEl=$('#qrLiveStatus');
          if(!st){ statusEl.textContent='رمز غير معروف'; statusEl.style.color='var(--danger)'; return; }
          const already=attendance.find(a=>a.subjectId===subject.id&&a.studentId===st.id&&a.date===today);
          const nowTimeStr=new Date().toLocaleTimeString('ar-IQ',{hour:'2-digit',minute:'2-digit'});
          if(!already){
            attendance.push({id:uid(),subjectId:subject.id,studentId:st.id,date:today,status:'present',time:nowTimeStr});
            saveAttendance();
            statusEl.textContent=`تم تسجيل دخول: ${st.name}`; statusEl.style.color='var(--ok)';
            log.unshift({name:st.name,time:nowTimeStr,kind:'دخول'}); renderLog();
          } else if(!already.outTime){
            already.outTime=nowTimeStr;
            saveAttendance();
            statusEl.textContent=`تم تسجيل خروج: ${st.name}`; statusEl.style.color='var(--ok)';
            log.unshift({name:st.name,time:nowTimeStr,kind:'خروج'}); renderLog();
          } else {
            statusEl.textContent=`${st.name} — دخول وخروج مسجلين مسبقاً اليوم`; statusEl.style.color='var(--gold-dark)';
          }
        }
      });
      input.addEventListener('blur',()=>{ setTimeout(()=>{ if($('#overlay').classList.contains('show') && $('#quickScanInput')) $('#quickScanInput').focus(); },50); });
    }
  }
  renderInner();
}

loadAll();
</script>
